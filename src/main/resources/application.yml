server:
  port: 8080

spring:
  application:
    name: ms-andesstay-bff

  # ── Validación del JWT emitido por Azure AD (Entra ID) ─────────────────────
  # Los valores por defecto son identificadores públicos del App Registration
  # (no son secretos); en EC2 se sobrescriben con variables de entorno.
  security:
    oauth2:
      resourceserver:
        jwt:
          # iss esperado en tokens v2.0
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:055d11d1-8ae0-4221-a6f7-b50be0a623b4}/v2.0
          # Claves públicas para verificar la firma (se descargan en la primera petición)
          jwk-set-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:055d11d1-8ae0-4221-a6f7-b50be0a623b4}/discovery/v2.0/keys
          # aud aceptados: los tokens v1 traen "api://<clientId>" y los v2 el GUID.
          # El issuer de arriba es el de v2: el manifest debe fijar requestedAccessTokenVersion = 2.
          audiences:
            - api://${AZURE_CLIENT_ID:704a544f-3d92-44f5-aef9-8559574cff34}
            - ${AZURE_CLIENT_ID:704a544f-3d92-44f5-aef9-8559574cff34}

  cloud:
    gateway:
      # Spring Cloud Gateway reenvía la cabecera Authorization tal cual al
      # microservicio downstream, que vuelve a validar el JWT (defensa en profundidad).
      routes:
        # ── Reservations ──────────────────────────────────────────────────────
        - id: reservations
          uri: ${RESERVATIONS_URL:http://localhost:8081}
          predicates:
            - Path=/api/reservations/**

        # ── Catalog ───────────────────────────────────────────────────────────
        - id: catalog
          uri: ${CATALOG_URL:http://localhost:8082}
          predicates:
            - Path=/api/catalog/**

        # ── Report ────────────────────────────────────────────────────────────
        - id: report
          uri: ${REPORT_URL:http://localhost:8083}
          predicates:
            - Path=/api/report/**

        # ── Audit ─────────────────────────────────────────────────────────────
        - id: audit
          uri: ${AUDIT_URL:http://localhost:8084}
          predicates:
            - Path=/api/audit/**

andesstay:
  security:
    # Orígenes permitidos por CORS (separados por coma). Agregar el dominio de producción.
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
